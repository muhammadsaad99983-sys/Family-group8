name: Build APK
"on":
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
      - name: Fix project structure
        run: |
          mkdir -p lib
          if ls *.dart 1> /dev/null 2>&1; then mv *.dart lib/; fi
          sed -i "s|state/||g; s|screens/||g; s|models/||g; s|widgets/||g; s|lib/||g" lib/*.dart
          sed -i "s/initialValue:/value:/g" lib/*.dart
          if ! grep -rq "class Vault" lib/; then
            printf '%s\n' "import 'dart:io';" "import 'package:path_provider/path_provider.dart';" "import 'dart:convert';" "class Vault {" "  static Future<Directory> dir() async {" "    final d = await getApplicationDocumentsDirectory();" "    final v = Directory('\${d.path}/vault');" "    if (!await v.exists()) await v.create(recursive: true);" "    return v;" "  }" "  static Future<void> save(dynamic people) async {" "    final d = await dir();" "    final f = File('\${d.path}/people.json');" "    try { await f.writeAsString(jsonEncode(people)); } catch (_) {}" "  }" "  static Future<dynamic> load() async {" "    try {" "      final d = await dir();" "      final f = File('\${d.path}/people.json');" "      if (await f.exists()) return jsonDecode(await f.readAsString());" "    } catch (_) {}" "    return null;" "  }" "}" > lib/vault.dart
          fi
          for f in lib/*.dart; do if grep -q "Vault\." "$f" && ! grep -q "vault.dart" "$f"; then sed -i "1i import 'vault.dart';" "$f"; fi; done
          if [ ! -f pubspec.yaml ]; then flutter create --template app --project-name family_group8 --org com.family.group . --overwrite; fi
          if [ ! -d android ]; then flutter create --template app --project-name family_group8 --org com.family.group . --overwrite; fi
          ls -R lib
      - name: Fix pubspec
        run: |
          if ! grep -q "path_provider" pubspec.yaml; then echo "  path_provider: ^2.1.2" >> pubspec.yaml; fi
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
