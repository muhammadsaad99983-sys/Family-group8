name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
      - name: Fix project structure
        run: |
          mkdir -p lib
          # ساری dart فائلیں lib میں لے جاؤ
          if ls *.dart 1> /dev/null 2>&1; then mv *.dart lib/; fi
          # غلط import ٹھیک کرو - state/ screens/ ہٹا دو
          sed -i "s|state/||g; s|screens/||g; s|models/||g; s|widgets/||g; s|lib/||g" lib/*.dart
          # اگر pubspec نہیں ہے تو بناؤ
          if [ ! -f pubspec.yaml ]; then
            flutter create --template app --project-name family_group8 --org com.family.group .
            rm -f lib/main.dart
            # ہماری فائلیں واپس lib میں رکھو - پہلے سے موجود ہیں
          fi
          # اگر android فولڈر نہیں ہے تو بناؤ
          if [ ! -d android ]; then
            flutter create --template app --project-name family_group8 --org com.family.group .
          fi
          ls -R lib
          cat lib/main.dart | head -n 10
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
