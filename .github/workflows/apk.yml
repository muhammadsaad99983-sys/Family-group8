name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          java-version: '17'
      - name: Fix project structure
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp pubspec.lock /tmp/backup/pubspec.lock || true
          cp main.dart /tmp/backup/main.dart || true
          for d in state screens models services widgets utils; do if [ -d $d ]; then cp -r $d /tmp/backup/$d; fi; done
          flutter create . --project-name family_group --org com.family.group
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/pubspec.lock pubspec.lock || true
          mkdir -p lib
          cp /tmp/backup/main.dart lib/main.dart
          for d in state screens models services widgets utils; do if [ -d /tmp/backup/$d ]; then cp -r /tmp/backup/$d lib/$d; fi; done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
