name: Build APK
"on":
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
      - name: Fix Pubspec and Make Clean App
        run: |
          cat pubspec.yaml
          sed -i "/path_provider/d" pubspec.yaml
          cat pubspec.yaml
          rm -rf lib/*.dart
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main() { runApp(MyApp()); }
          class MyApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: HomePage(),
              );
            }
          }
          class HomePage extends StatefulWidget {
            @override
            _HomePageState createState() => _HomePageState();
          }
          class _HomePageState extends State<HomePage> {
            List<String> names = [];
            TextEditingController c = TextEditingController();
            String marital = 'Single';
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Family Group 8')),
                body: Padding(
                  padding: EdgeInsets.all(16),
                  child: Column(
                    children: [
                      TextField(controller: c, decoration: InputDecoration(labelText: 'Name Likhen')),
                      SizedBox(height: 10),
                      DropdownButtonFormField<String>(
                        value: marital,
                        items: ['Single','Married'].map((e) => DropdownMenuItem(value: e, child: Text(e))).toList(),
                        onChanged: (v) { setState(() { marital = v!; }); },
                      ),
                      SizedBox(height: 10),
                      ElevatedButton(
                        onPressed: () { if (c.text.isNotEmpty) { setState(() { names.add(c.text + ' - ' + marital); c.clear(); }); } },
                        child: Text('Add Member'),
                      ),
                      Expanded(child: ListView.builder(itemCount: names.length, itemBuilder: (ctx, i) => ListTile(title: Text(names[i])))),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
