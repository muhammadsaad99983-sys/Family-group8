name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Fix project structure - FORCE REBUILD ANDROID
        run: |
          mkdir -p /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp pubspec.lock /tmp/backup/pubspec.lock 2>/dev/null || true
          # lib ho to lib se lo, warna root se lo
          if [ -d lib ]; then cp -r lib/. /tmp/backup/lib/; fi
          if [ -f main.dart ]; then cp main.dart /tmp/backup/lib/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/backup/lib/main.dart; fi
          for d in state screens models services widgets utils; do
            if [ -d "lib/$d" ]; then cp -r "lib/$d" /tmp/backup/lib/; fi
            if [ -d "$d" ]; then cp -r "$d" /tmp/backup/lib/; fi
          done
          echo "=== BACKUP ==="
          find /tmp/backup -type f | sort
          echo "Deleting old broken android folder..."
          rm -rf android ios web macos windows linux .dart_tool build
          flutter create . --project-name family_group --org com.family.group --overwrite
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/pubspec.lock pubspec.lock 2>/dev/null || true
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/backup/lib/. lib/
          echo "=== FINAL LIB ==="
          find lib -type f | sort
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
